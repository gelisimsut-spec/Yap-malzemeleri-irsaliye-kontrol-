services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: irsaliye
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  backend:
    build: ./backend
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/irsaliye
      WHATSAPP_API_BASE_URL: http://whatsapp-api:3001
      UNMATCHED_NOTIFY_MINUTES: 30
      NOTIFY_COOLDOWN_HOURS: 4
    ports:
      - "3000:3000"
    depends_on:
      - db

  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:3000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
