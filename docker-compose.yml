version: '3.9'
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: irsaliye
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    image: node:20
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/irsaliye
      PORT: 4000
    ports:
      - '4000:4000'
    depends_on:
      - db

  frontend:
    image: node:20
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    volumes:
      - ./frontend:/app
    environment:
      VITE_API_URL: http://localhost:4000/api
    ports:
      - '5173:5173'
    depends_on:
      - backend

volumes:
  postgres_data:
